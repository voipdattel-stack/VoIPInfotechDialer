name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── Debug build (no signing secrets needed) ──────────────────────
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VoIPInfotech-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── Release build (requires GitHub Secrets) ──────────────────────
      - name: Generate debug keystore (if no release secrets)
        if: ${{ !secrets.KEYSTORE_BASE64 }}
        run: |
          keytool -genkey -v \
            -keystore app/keystore/debug.jks \
            -alias voipinfotech \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass voipinfotech \
            -keypass voipinfotech \
            -dname "CN=VoIP Infotech, OU=Mobile, O=VoIP Infotech, L=India, S=India, C=IN"

      - name: Decode release keystore
        if: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore/release.jks

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_BASE64 && 'keystore/release.jks' || 'keystore/debug.jks' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'voipinfotech' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'voipinfotech' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'voipinfotech' }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: VoIPInfotech-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90
